# Slack app manifest for Taro.
# api.slack.com/apps, then Create New App, then "From an app manifest", then paste this.
# Replace YOUR-API-DOMAIN with the host from API_URL first.
#
# After creating it:
#  1. Basic Information, App-Level Tokens: create one with connections:write (SLACK_APP_TOKEN).
#  2. Basic Information, App Credentials: copy Client ID and Client Secret.
#  3. Manage Distribution: activate public distribution so other Slack workspaces
#     can sign in and add Taro. Skip this if only your own workspace will use it.

display_information:
  name: Taro
  description: Say it in the meeting. Done before you hang up.
  background_color: "#4e3564"

features:
  bot_user:
    display_name: taro
    always_online: true

oauth_config:
  redirect_urls:
    # Adding Taro to Slack
    - https://YOUR-API-DOMAIN/api/slack/callback
    # Sign in with Slack
    - https://YOUR-API-DOMAIN/api/auth/slack/callback
  scopes:
    bot:
      - chat:write
      - channels:read
      - channels:join
      - channels:history
      - users:read
    user:
      - openid
      - email
      - profile

settings:
  event_subscriptions:
    bot_events:
      - message.channels
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
